name: CI

# Origin does not execute this file by itself. Depot and Buildkite, installed
# from the Origin app marketplace, run GitHub Actions workflow syntax on an
# Origin-hosted repository. The same command list is `npm run ci`, which
# Vercel runs as its build command.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Node major pinned beside .nvmrc. This workflow does not deploy.
  DEPLOY_NODE: '26.x'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Check Node pin matches .nvmrc
        shell: bash
        run: |
          pinned="$(tr -d 'v[:space:]' < .nvmrc | cut -d. -f1)"
          wanted="${DEPLOY_NODE%%.*}"
          if [ "$pinned" != "$wanted" ]; then
            echo "::error file=.nvmrc::.nvmrc pins Node $pinned but DEPLOY_NODE is $DEPLOY_NODE. Update both."
            exit 1
          fi
          echo "Pinned Node $wanted matches .nvmrc."

      - name: Install dependencies
        run: npm ci

      - name: Format, lint, types, tests, guard, share cards, build, export
        run: npm run ci
